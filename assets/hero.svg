<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" fill="none">
  <title>Muhammad Farhan — Fullstack Web Developer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#09090b"/>
      <stop offset="1" stop-color="#18181b"/>
    </linearGradient>
    <radialGradient id="orbA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ed5d31" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ed5d31" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fb923c" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ed5d31" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ed5d31"/>
      <stop offset="1" stop-color="#ed5d31" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="900" height="300" rx="14"/></clipPath>
  </defs>

  <style>
    text { font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif; }
    .orbA { animation: driftA 9s ease-in-out infinite alternate; }
    .orbB { animation: driftB 11s ease-in-out infinite alternate; }
    @keyframes driftA { from { transform: translate(0,0) scale(1); } to { transform: translate(90px,30px) scale(1.15); } }
    @keyframes driftB { from { transform: translate(0,0) scale(1); } to { transform: translate(-80px,-25px) scale(1.2); } }

    .eyebrow { animation: rise 0.9s cubic-bezier(.22,1,.36,1) 0.1s both; }
    .name    { animation: rise 1s cubic-bezier(.22,1,.36,1) 0.25s both; }
    .role-wrap { animation: rise 1s cubic-bezier(.22,1,.36,1) 0.45s both; }
    .meta    { animation: rise 1s cubic-bezier(.22,1,.36,1) 0.7s both; }
    @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }

    .role { opacity: 0; animation: cycle 12s cubic-bezier(.22,1,.36,1) infinite; }
    .r1 { animation-delay: 1s; }
    .r2 { animation-delay: 4s; }
    .r3 { animation-delay: 7s; }
    .r4 { animation-delay: 10s; }
    @keyframes cycle {
      0%   { opacity: 0; transform: translateY(14px); filter: blur(4px); }
      4%   { opacity: 1; transform: translateY(0);    filter: blur(0); }
      22%  { opacity: 1; transform: translateY(0);    filter: blur(0); }
      26%  { opacity: 0; transform: translateY(-14px); filter: blur(4px); }
      100% { opacity: 0; transform: translateY(-14px); }
    }

    .line { transform-origin: left center; animation: grow 1.4s cubic-bezier(.22,1,.36,1) 0.9s both; }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }

    .scan { animation: scan 5s linear infinite; }
    @keyframes scan { from { transform: translateX(-300px); } to { transform: translateX(1200px); } }

    .pulse { animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="900" height="300" fill="url(#bg)"/>
    <rect width="900" height="300" fill="url(#grid)"/>
    <g class="orbA"><circle cx="720" cy="70" r="190" fill="url(#orbA)"/></g>
    <g class="orbB"><circle cx="780" cy="260" r="170" fill="url(#orbB)"/></g>
    <rect class="scan" y="0" width="260" height="2" fill="url(#sweep)" opacity="0.55"/>
  </g>
  <rect x="0.5" y="0.5" width="899" height="299" rx="13.5" stroke="#3f3f46" stroke-opacity="0.7"/>

  <g class="eyebrow">
    <rect x="56" y="52" width="8" height="8" fill="#22c55e" class="pulse"/>
    <text x="74" y="60" font-size="12" font-weight="700" letter-spacing="1.8" fill="#a1a1aa">AVAILABLE FOR WORK  ·  PEKANBARU, ID</text>
  </g>

  <g class="name">
    <text x="54" y="128" font-size="58" font-weight="800" letter-spacing="-1.8" fill="#fafafa">Muhammad Farhan<tspan fill="#ed5d31">.</tspan></text>
  </g>

  <g class="role-wrap">
    <g class="role r1"><text x="56" y="178" font-size="30" font-weight="700" fill="#ed5d31">Fullstack Web Developer</text></g>
    <g class="role r2"><text x="56" y="178" font-size="30" font-weight="700" fill="#ed5d31">Founder of HanDigital</text></g>
    <g class="role r3"><text x="56" y="178" font-size="30" font-weight="700" fill="#ed5d31">Next.js · React · Laravel</text></g>
    <g class="role r4"><text x="56" y="178" font-size="30" font-weight="700" fill="#ed5d31">SaaS, ERP &amp; Digital Products</text></g>
  </g>

  <rect class="line" x="56" y="210" width="220" height="2" fill="#ed5d31"/>

  <g class="meta">
    <text x="56" y="246" font-size="14" font-weight="500" fill="#a1a1aa">Mahasiswa Teknik Informatika  ·  4+ tahun membangun web &amp; sistem aplikasi</text>
    <text x="56" y="268" font-size="13" font-weight="600" fill="#71717a">hannn.my.id<tspan fill="#ed5d31" class="cursor">  ▍</tspan></text>
  </g>
</svg>
