<svg xmlns="http://www.w3.org/2000/svg" width="900" height="12" viewBox="0 0 900 12" fill="none">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ed5d31" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ed5d31"/>
      <stop offset="1" stop-color="#ed5d31" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .base { fill: #71717a; opacity: 0.25; }
    .beam { animation: move 3.6s cubic-bezier(.65,0,.35,1) infinite; }
    @keyframes move { from { transform: translateX(-340px); } to { transform: translateX(900px); } }
  </style>
  <rect class="base" x="0" y="5" width="900" height="1"/>
  <rect class="beam" x="0" y="4" width="340" height="3" fill="url(#g)"/>
</svg>
