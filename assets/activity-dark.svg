<svg xmlns="http://www.w3.org/2000/svg" width="900" height="74" viewBox="0 0 900 74" fill="none">
  <style>
    text { font-family:'Plus Jakarta Sans','Segoe UI',system-ui,-apple-system,sans-serif; }
    .pulse { animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }
    .bar { transform-box: fill-box; transform-origin: left; animation: barIn 0.8s cubic-bezier(.22,1,.36,1) both; }
    @keyframes barIn { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  </style>
  <rect x="0.5" y="0.5" width="899" height="73" fill="#111114" stroke="#3f3f46"/>
  <rect class="bar" x="0" y="0" width="120" height="2" fill="#ed5d31"/>
  <rect x="24" y="21" width="8" height="8" fill="#10B981" class="pulse"/>
  <text x="42" y="29" font-size="11" font-weight="800" letter-spacing="1.4" fill="#ed5d31">LATEST ACTIVITY</text>
  <text x="166" y="29" font-size="12" font-weight="700" fill="#fafafa">mhdfrhan/mhdfrhan</text>
  <text x="24" y="52" font-size="13" font-weight="500" fill="#a1a1aa">Shipping Next.js, Laravel &amp; ERP systems</text>
  <text x="876" y="29" font-size="11" font-weight="700" fill="#71717a" text-anchor="end">15H AGO</text>
  <text x="876" y="52" font-size="11.5" font-weight="700" fill="#ed5d31" text-anchor="end">7d active streak</text>
</svg>